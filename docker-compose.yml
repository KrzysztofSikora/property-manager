services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: property_manager
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d property_manager']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # postgres 18 keeps PGDATA in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
