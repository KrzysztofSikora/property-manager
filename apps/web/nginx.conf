server {
  listen 80;
  root /usr/share/nginx/html;

  # Same origin as the UI, so the browser needs no CORS.
  location /graphql {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  # SPA fallback: deep links such as /properties/new load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
