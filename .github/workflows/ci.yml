name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

      - name: Codegen drift
        run: |
          pnpm codegen
          git diff --exit-code
          untracked="$(git status --porcelain -- apps/api/src/graphql/generated apps/web/src/graphql)"
          if [ -n "$untracked" ]; then
            echo "Generated files are out of date:"
            echo "$untracked"
            exit 1
          fi

      - name: Migration drift
        run: |
          pnpm db:generate
          drift="$(git status --porcelain -- apps/api/drizzle)"
          if [ -n "$drift" ]; then
            echo "apps/api/drizzle is out of step with src/db/schema.ts. Run pnpm db:generate:"
            echo "$drift"
            exit 1
          fi

      - name: Test (unit + integration)
        run: pnpm test
        env:
          WEATHERSTACK_KEY: TEST_WEATHERSTACK_KEY
